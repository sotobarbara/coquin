<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130F">
<meta name="robots" content="noindex">
<title>Coquin · Contratação</title>
<link rel="icon" href="logo-coquin.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ============================================================
   COQUIN — Contratação · painel da equipe (desktop-first, quadro kanban)
   Paleta: neutros quentes + coral da marca
   ============================================================ */
:root{
  --bg:#F6F4F0; --surface:#FFFFFF; --sunken:#F0EDE7; --hover:#FAF8F5;
  --ink:#1A1714; --ink-2:#4A453F; --muted:#8C867E; --faint:#B5AFA6;
  --line:#E8E3DB; --line-2:#DAD4CA;
  --accent:#E5623D; --accent-2:#C94E2C; --accent-soft:#FCEDE7;
  --side:#16130F; --side-2:#24201B; --side-ink:#EDE8E1; --side-muted:#8F887F;
  --tA:#1E7F5C; --tA-s:#E2F3EB; --tB:#A86B12; --tB-s:#FAF0DA; --tC:#6B6A66; --tC-s:#EFEEEB; --tX:#C2413A; --tX-s:#FBE6E3;
  --sh-1:0 1px 2px rgba(26,23,20,.04),0 1px 1px rgba(26,23,20,.03);
  --sh-2:0 1px 2px rgba(26,23,20,.05),0 6px 20px -4px rgba(26,23,20,.10);
  --sh-3:0 24px 60px -12px rgba(26,23,20,.28);
  --serif:"Instrument Serif",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;font-feature-settings:"cv11","ss01"}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hide{display:none!important}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100vh}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:22px 14px 16px;overflow-y:auto}
.side .logo{height:20px;width:auto;align-self:flex-start;display:block;margin:4px 10px 8px}
.side .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);margin:0 10px 26px}
.nav{display:grid;gap:2px;grid-template-columns:minmax(0,1fr)}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--side-muted);padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:500;text-align:left}
.nav button:hover{color:var(--side-ink);background:var(--side-2)}
.nav button.sel{color:#fff;background:var(--side-2)}
.side h6{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);margin:26px 10px 8px}
.vnav{display:grid;gap:1px;grid-template-columns:minmax(0,1fr)}
.vnav button{display:flex;align-items:center;gap:9px;border:0;background:none;color:var(--side-muted);padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500}
.vnav button:hover{background:var(--side-2);color:var(--side-ink)}
.vnav button.sel{background:var(--side-2);color:#fff}
.vnav .dot{width:7px;height:7px;border-radius:99px;background:var(--tA);flex:none}
.vnav .dot.off{background:#57514A}
.vnav .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vnav .n{font-size:12px;color:var(--side-muted);font-variant-numeric:tabular-nums}
.side .grow{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--side-2);margin-top:18px}
.me .av{width:30px;height:30px;font-size:12px;background:var(--accent);color:#fff}
.me .em{flex:1;min-width:0;font-size:12.5px;color:var(--side-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me button{border:0;background:none;color:var(--side-muted);cursor:pointer;padding:4px;border-radius:6px}
.me button:hover{color:#fff}
.main{display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:26px 28px 18px;flex-wrap:wrap}
.top h1{font-family:var(--serif);font-weight:400;font-size:38px;letter-spacing:-.01em;line-height:1;margin:0}
.top .meta{display:flex;gap:18px;margin-top:10px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.top .meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.top .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{display:flex;gap:10px;align-items:center;padding:0 28px 16px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0 11px;height:36px;min-width:240px;color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;color:var(--ink);height:100%}
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px;display:flex;align-items:center;gap:6px}
.seg button.sel{background:var(--surface);box-shadow:var(--sh-1);color:var(--ink)}
.seg .tdot{width:7px;height:7px;border-radius:99px}
.spacer{flex:1}
select.sm{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;cursor:pointer}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:#2E2924}
.btn.accent{background:var(--accent);border-color:var(--accent)}
.btn.accent:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--hover);border-color:var(--faint)}
.btn.danger{background:var(--surface);color:var(--tX);border-color:#EBC9C5}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.full{width:100%;height:42px}

/* ---------- quadro ---------- */
.board{flex:1;display:flex;gap:12px;overflow-x:auto;padding:2px 28px 28px;align-items:flex-start}
.col{flex:1 1 0;min-width:224px;max-width:340px;background:var(--sunken);border-radius:14px;display:flex;flex-direction:column;max-height:100%;border:1px solid transparent;transition:border-color .15s,background .15s}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding:13px 14px 10px}
.col-h .cd{width:8px;height:8px;border-radius:99px}
.col-h .ct{font-weight:600}
.col-h .cn{font-size:12px;color:var(--muted);background:var(--surface);border-radius:99px;padding:1px 8px;font-variant-numeric:tabular-nums}
.col-h .cs{display:none}
.col-b{padding:0 8px 10px;overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-height:60px;align-content:start}
.kc{min-width:0}.chips{min-width:0}
.col-e{border:1.5px dashed var(--line-2);border-radius:10px;padding:18px 10px;text-align:center;color:var(--faint);font-size:12.5px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 12px 10px;box-shadow:var(--sh-1);cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .15s;position:relative}
.kc:hover{box-shadow:var(--sh-2);border-color:var(--line-2)}
.kc.dragging{opacity:.4}
.kc.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.kc-top{display:flex;gap:10px;align-items:flex-start}
.av{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none;letter-spacing:.02em}
.kc-n{flex:1;min-width:0}
.kc-n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc-n span{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.kc-n span svg{width:12px;height:12px}
.sc{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:7px;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;flex:none}
.sc i{font-style:normal;font-size:10.5px;font-weight:600;opacity:.75}
.sc.A{background:var(--tA-s);color:var(--tA)} .sc.B{background:var(--tB-s);color:var(--tB)} .sc.C{background:var(--tC-s);color:var(--tC)} .sc.X{background:var(--tX-s);color:var(--tX)}
.kc-bar{height:3px;border-radius:99px;background:var(--sunken);margin:11px 0 9px;overflow:hidden}
.kc-bar>i{display:block;height:100%;border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-block;font-size:11.5px;color:var(--ink-2);background:var(--sunken);border-radius:6px;padding:2px 7px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.ko{background:var(--tX-s);color:var(--tX)}
.chip.auto{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.kc-f{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--muted);font-size:11.5px}
.kc-f .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.kc-f svg{width:13px;height:13px}
.stars{color:var(--accent);letter-spacing:1px;font-size:11px}
.unread{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:99px;background:var(--accent);border:2px solid var(--surface)}

/* ---------- vagas ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;padding:2px 28px 32px;overflow-y:auto}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:14px}
.vc-h{display:flex;gap:12px;align-items:flex-start}
.vc-h h3{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.05;margin:0}
.vc-h p{margin:4px 0 0;color:var(--muted);font-size:13px}
.vc-stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vc-stats div{padding:10px 12px;border-right:1px solid var(--line)}
.vc-stats div:last-child{border-right:0}
.vc-stats b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.vc-stats span{font-size:11.5px;color:var(--muted)}
.link{display:flex;align-items:center;gap:8px;background:var(--sunken);border-radius:9px;padding:0 6px 0 11px;height:36px;color:var(--ink-2);font-size:12.5px}
.link span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link button{border:0;background:var(--surface);border-radius:6px;height:26px;padding:0 8px;cursor:pointer;font-size:12px;font-weight:600;box-shadow:var(--sh-1)}
.vc-a{display:flex;gap:6px;flex-wrap:wrap}
.vc-new{border:1.5px dashed var(--line-2);background:transparent;border-radius:14px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);cursor:pointer;font-weight:500}
.vc-new:hover{border-color:var(--accent);color:var(--accent)}
.sw{position:relative;width:36px;height:20px;flex:none;margin-left:auto}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--line-2);border-radius:99px;cursor:pointer;transition:.2s}
.sw i::after{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;border-radius:99px;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--tA)}
.sw input:checked+i::after{transform:translateX(16px)}

/* ---------- painel lateral (drawer) ---------- */
.scrim{position:fixed;inset:0;background:rgba(22,19,15,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;backdrop-filter:blur(1px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);z-index:50;box-shadow:var(--sh-3);transform:translateX(102%);transition:transform .32s cubic-bezier(.32,.72,0,1),visibility 0s .32s;visibility:hidden;display:flex;flex-direction:column}
.sheet.wide{width:min(720px,100vw)}
.sheet.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.32,.72,0,1)}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 24px;border-bottom:1px solid var(--line);flex:none}
.sh-title{font-weight:600;font-size:15px}
.x{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.x:hover{background:var(--hover)}
.sh-body{flex:1;overflow-y:auto;padding:0 24px 28px}
.blk{padding:20px 0;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.blk h4{margin:0 0 12px;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ph{display:flex;gap:16px;align-items:center}
.ph .av{width:56px;height:56px;font-size:19px}
.ph h2{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1;margin:0 0 6px}
.ph p{margin:0;color:var(--muted);font-size:13px}
.scorebox{display:flex;gap:18px;align-items:center;background:var(--hover);border:1px solid var(--line);border-radius:14px;padding:16px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.scorebox .tl{font-weight:600;font-size:15px}
.scorebox .ts{color:var(--muted);font-size:12.5px;margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.stagesel{display:flex;gap:4px;flex-wrap:wrap}
.stagesel button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;height:32px;padding:0 11px;cursor:pointer;font-weight:500;font-size:13px;color:var(--ink-2)}
.stagesel button .cd{width:7px;height:7px;border-radius:99px}
.stagesel button.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.starsel{display:flex;gap:2px}
.starsel button{border:0;background:none;font-size:22px;cursor:pointer;color:var(--line-2);padding:0 1px;line-height:1}
.starsel button.on{color:var(--accent)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:9px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv a{color:var(--ink);text-decoration-color:var(--line-2);text-underline-offset:3px}
.brk{display:grid;gap:13px}
.brow .bh{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:500}
.brow .bh span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.brow .ba{font-size:12.5px;color:var(--muted);margin-top:1px}
.brow .bb{height:4px;border-radius:99px;background:var(--sunken);margin-top:6px;overflow:hidden}
.brow .bb>i{display:block;height:100%;background:var(--ink);border-radius:99px}
.brow.ko .bh{color:var(--tX)} .brow.ko .bb>i{background:var(--tX)}
.about{font-size:14px;white-space:pre-wrap;color:var(--ink-2);line-height:1.6}
.about mark{background:var(--accent-soft);color:var(--accent-2);border-radius:3px;padding:0 2px}
.alert{background:var(--tX-s);color:var(--tX);border-radius:10px;padding:12px 14px;font-size:13px}
textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;background:var(--surface);line-height:1.5}
textarea:focus,input:focus,select:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px rgba(26,23,20,.06)}

/* ---------- editor (mesmas classes do motor) ---------- */
.f{margin-bottom:14px}
.f label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.f input,.f textarea,.f select{width:100%}
.sheet input[type=text],.sheet input[type=number],.sheet select{height:38px;border:1px solid var(--line-2);border-radius:9px;padding:0 11px;background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qed{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--hover)}
.qed-h{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.qed-h input{flex:1;font-weight:500}
.qed-h select{width:auto;flex:none}
.ib{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;width:34px;height:34px;cursor:pointer;color:var(--ink-2);flex:none;font-size:13px}
.ib:hover{background:var(--hover)}
.oed,.oh{display:grid;grid-template-columns:1fr 76px 64px 34px;gap:6px;align-items:center}
.oed{margin-bottom:6px}
.oed input[type=number]{text-align:center;padding:0 4px}
.oh{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 0}
.kol{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--tX);cursor:pointer}
.kol input{accent-color:var(--tX)}
.qmeta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.qmeta input[type=number]{width:70px;height:30px}
.qmeta input[type=text]{height:30px}
.kwed{display:grid;grid-template-columns:1fr 76px 34px;gap:6px;margin-bottom:6px}
.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.note.box{background:var(--tB-s);color:#7A5310;border-radius:10px;padding:11px 13px}
.maxpts{display:inline-block;font-size:12.5px;font-weight:600;background:var(--sunken);border-radius:7px;padding:5px 10px}
.vlink{display:flex;align-items:center;background:var(--sunken);border-radius:9px;padding:0 11px;height:38px;font-size:12.5px;color:var(--ink-2);overflow:hidden}
.vlink span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artprev{width:100%;border-radius:10px;display:block;box-shadow:var(--sh-2)}
pre.cap{white-space:pre-wrap;background:var(--hover);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13px;font-family:inherit;margin:0;line-height:1.55}

/* ---------- login + toast ---------- */
.authgate{position:fixed;inset:0;z-index:60;background:var(--side);display:none;align-items:center;justify-content:center;padding:24px}
.authgate.on{display:flex}
.auth-card{width:100%;max-width:360px;color:var(--side-ink)}
.auth-card img{height:26px;margin-bottom:34px}
.auth-card h1{font-family:var(--serif);font-weight:400;font-size:40px;margin:0 0 8px;line-height:1}
.auth-card p{color:var(--side-muted);margin:0 0 26px}
.auth-card input{width:100%;height:46px;border:1px solid #3A342D;border-radius:10px;padding:0 14px;margin-bottom:10px;background:var(--side-2);color:#fff}
.auth-card input:focus{border-color:var(--accent);box-shadow:none}
.auth-err{color:#F3A593;font-size:13px;min-height:18px;margin:2px 0 10px}
.auth-card .btn{width:100%;height:46px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--sh-3);opacity:0;pointer-events:none;transition:.22s;z-index:70;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- telas menores ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  .side{flex-direction:row;align-items:center;gap:10px;padding:12px 14px;overflow-x:auto;position:sticky;top:0;z-index:20}
  .side .logo{margin:0}
  .side .sub,.side h6,.vnav,.side .grow{display:none}
  .nav{display:flex}
  .me{border:0;margin:0 0 0 auto;padding:0}
  .me .em{display:none}
  .main{height:auto;overflow:visible}
  .top{padding:20px 16px 14px}
  .top h1{font-size:30px}
  .bar{padding:0 16px 14px}
  .search{min-width:0;flex:1}

<script>
'use strict';
const SUPABASE_URL='https://anrfipczginloozmatht.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFucmZpcGN6Z2lubG9vem1hdGh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5ODk3NzEsImV4cCI6MjEwMDU2NTc3MX0.Je1pF13l5Lael0EZkDC6o1Qk2XJWcusmX_ElcvdPx40';

/* etapas do pipeline. "Não qualificados" recebe sozinho quem chega com nível C ou eliminado. */
const STATUS=[
  {k:'novo',l:'Aplicações',c:'#3B6FD8'},{k:'triagem',l:'Em validação',c:'#C08A1E'},{k:'entrevista',l:'Entrevista',c:'#7C4DCC'},

const TIERS={A:'Priorizar',B:'Avaliar',C:'Baixa aderência',X:'Eliminado'};
const TIERC={A:'#1E7F5C',B:'#C08A1E',C:'#9A948C',X:'#C2413A'};
/* ---------- modelo padrão de regras (atendente de gelato) ----------
   Cada resposta vale pontos. "ko" = eliminatória (marca o candidato como Eliminado).
   Score = pontos obtidos ÷ pontos possíveis × 100. A ≥ 75 · B ≥ 50 · C abaixo. */
function templateAtendente(){
  return {
    questions:[
      {k:'dias',label:'Quais dias você pode trabalhar?',type:'multi',required:true,cap:10,options:[
        {v:'semana',l:'Segunda a sexta',pts:3},{v:'sab',l:'Sábado',pts:3},{v:'dom',l:'Domingo',pts:3},{v:'feriado',l:'Feriados',pts:1}]},
      {k:'turno',label:'Quais turnos?',type:'multi',required:true,cap:5,options:[
        {v:'manha',l:'Manhã',pts:1},{v:'tarde',l:'Tarde',pts:2},{v:'noite',l:'Noite',pts:2}]},
      {k:'exp_atend',label:'Experiência com atendimento ao público',type:'single',required:true,options:[
        {v:'nao',l:'Nunca trabalhei',pts:0},{v:'6m',l:'Menos de 6 meses',pts:2},{v:'2a',l:'6 meses a 2 anos',pts:4},{v:'mais',l:'Mais de 2 anos',pts:5}]},
      {k:'exp_food',label:'Já trabalhou com sorvete, açaí, cafeteria ou alimentação?',type:'single',required:true,options:[
        {v:'sim',l:'Sim',pts:4},{v:'nao',l:'Não',pts:0}]},
      {k:'caixa',label:'Já operou caixa / maquininha de cartão?',type:'single',required:true,options:[
        {v:'sim',l:'Sim',pts:2},{v:'nao',l:'Não',pts:0}]},
      {k:'escala',label:'Topa escala 6x1 com folga rotativa (inclui fins de semana)?',type:'single',required:true,options:[
        {v:'sim',l:'Sim',pts:3},{v:'talvez',l:'Depende',pts:1},{v:'nao',l:'Não',pts:0,ko:true}]},
      {k:'distancia',label:'Quanto tempo você leva até a loja?',type:'single',required:true,options:[
        {v:'20',l:'Até 20 min',pts:4},{v:'40',l:'20 a 40 min',pts:3},{v:'60',l:'40 min a 1h',pts:1},{v:'1h',l:'Mais de 1h',pts:0}]},
      {k:'inicio',label:'Quando pode começar?',type:'single',required:true,options:[
        {v:'ja',l:'Imediatamente',pts:3},{v:'15',l:'Em até 15 dias',pts:2},{v:'30',l:'Em 30 dias ou mais',pts:0}]},
      {k:'maior',label:'Você tem 18 anos ou mais?',type:'single',required:true,hint:'Necessário pelo horário noturno.',options:[
        {v:'sim',l:'Sim',pts:0},{v:'nao',l:'Não',pts:0,ko:true}]}
    ],
    keywords:[{w:'atendimento',pts:2},{w:'sorvet',pts:3},{w:'gelato',pts:3},{w:'acai',pts:2},{w:'cafeteria',pts:2},{w:'barista',pts:2},{w:'caixa',pts:1},{w:'vendas',pts:1},{w:'lanchonete',pts:1},{w:'cliente',pts:1}],
    kw_max:8, thresholds:{a:75,b:50}
  };
}

/* ---------- utils ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const slugify=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48);
const rid=()=>'o'+Math.random().toString(36).slice(2,8);
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function formUrl(id){ return location.origin+location.pathname.replace(/admin(\.html)?$/,'')+'?v='+encodeURIComponent(id); }
async function copy(txt,msg){ try{ await navigator.clipboard.writeText(txt); toast(msg||'Copiado ✓'); }catch(e){ prompt('Copie:',txt); } }
function waNumber(p){ let d=String(p||'').replace(/\D/g,''); if(d.length<=11) d='55'+d; return d; }

/* ---------- estado ---------- */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{persistSession:true,autoRefreshToken:true}});
let vagas=[], cands=[], view='cand';
const UI={vaga:'all',status:'all',tier:'all',q:'',sort:'score'};
try{ Object.assign(UI,JSON.parse(localStorage.getItem('coquin-vagas-ui')||'{}')); }catch(e){}
function saveUI(){ try{ localStorage.setItem('coquin-vagas-ui',JSON.stringify({vaga:UI.vaga,sort:UI.sort})); }catch(e){} }

/* ---------- motor de pontuação ---------- */
function scoreCand(c){
  const v=vagas.find(x=>x.id===c.vaga_id)||{};
  const qs=Array.isArray(v.questions)?v.questions:[];
  const ans=c.answers||{};
  let got=0,max=0; const parts=[], kos=[], highlights=[];
  qs.forEach(q=>{
    const opts=q.options||[]; let qmax=0,qgot=0; const picked=[]; let ko=false;
    if(q.type==='multi'){
      const pos=opts.reduce((s,o)=>s+Math.max(0,+o.pts||0),0);
      qmax=(+q.cap>0)?Math.min(+q.cap,pos):pos;
      (Array.isArray(ans[q.k])?ans[q.k]:[]).forEach(val=>{ const o=opts.find(o=>o.v===val); if(o){ qgot+=(+o.pts||0); picked.push(o.l); if(o.ko) ko=true; } });
      qgot=Math.min(qgot,qmax);
    }else{
      qmax=Math.max(0,...opts.map(o=>+o.pts||0));
      const o=opts.find(o=>o.v===ans[q.k]); if(o){ qgot=(+o.pts||0); picked.push(o.l); if(o.ko) ko=true; }
    }
    qgot=Math.max(0,qgot);
    if(ko) kos.push(q.label+' → '+picked.join(', '));
    if(qmax>0 && qgot>=qmax) highlights.push(q.label);
    got+=qgot; max+=qmax;
    parts.push({label:q.label,ans:picked.length?picked.join(', '):'—',got:qgot,max:qmax,ko});
  });
  // palavras-chave no texto livre
  const kws=(Array.isArray(v.keywords)?v.keywords:[]).filter(k=>k&&k.w);
  if(kws.length){
    const text=norm(c.about);
    const hit=kws.filter(k=>text.includes(norm(k.w)));
    const all=kws.reduce((s,k)=>s+Math.max(0,+k.pts||0),0);
    const cap=(+v.kw_max>0)?Math.min(+v.kw_max,all):all;
    const kg=Math.min(cap,hit.reduce((s,k)=>s+Math.max(0,+k.pts||0),0));
    got+=kg; max+=cap;
    parts.push({label:'Palavras-chave no texto',ans:hit.length?hit.map(k=>k.w).join(', '):'nenhuma',got:kg,max:cap,ko:false,kw:true});
  }
  const pct=max?Math.round(got/max*100):0;
  const th=v.thresholds||{a:75,b:50};
  const tier=kos.length?'X':pct>=(+th.a||75)?'A':pct>=(+th.b||50)?'B':'C';
  return {pct,got,max,tier,parts,kos,highlights};
}

/* ---------- dados ---------- */
async function load(){
  const [{data:v,error:e1},{data:c,error:e2}]=await Promise.all([
    sb.from('vagas').select('*').order('created_at',{ascending:false}),
    sb.from('candidaturas').select('*').order('created_at',{ascending:false})]);
  if(e1||e2) throw (e1||e2);
  vagas=v||[]; cands=(c||[]).map(x=>Object.assign(x,{_s:null}));
  render();
}
function sc(c){ if(!c._s) c._s=scoreCand(c); return c._s; }
function rescore(){ cands.forEach(c=>c._s=null); }

/* ---------- visual ---------- */
const ic=n=>'<svg class="i"><use href="#i-'+n+'"/></svg>';
const AVC=[['#FCE3D9','#B4471F'],['#E0ECF9','#2E5C99'],['#E2F1E8','#1E6B4C'],['#F1E6F7','#6B3C8C'],['#FAEFD7','#8A5E10'],['#ECEAE6','#4A453F']];
function avatar(name,cls){
  const p=String(name||'?').trim().split(/\s+/).filter(Boolean);
  const t=((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();
  let h=0; for(const ch of String(name)) h=(h*31+ch.charCodeAt(0))>>>0;
  const [bg,fg]=AVC[h%AVC.length];
  return '<span class="av '+(cls||'')+'" style="background:'+bg+';color:'+fg+'">'+esc(t)+'</span>';
}
function ago(iso){ const m=(Date.now()-new Date(iso))/60000; if(m<60) return Math.max(1,Math.round(m))+' min'; const h=m/60; if(h<24) return Math.round(h)+' h'; const d=h/24; if(d<30) return Math.round(d)+' d'; return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}); }
/* coluna do quadro: quem chega com nível C ou eliminado já cai em "Não qualificados" */
function colOf(c){ if(c.status==='reprovado') return 'reprovado'; if(c.status==='novo' && (sc(c).tier==='C'||sc(c).tier==='X')) return 'reprovado'; return STATUS.some(s=>s.k===c.status)?c.status:'novo'; }
function autoNQ(c){ return c.status==='novo' && colOf(c)==='reprovado'; }
function filtered(base){
  return base.filter(c=>{
    if(UI.tier!=='all' && sc(c).tier!==UI.tier) return false;
    if(UI.q){ const q=norm(UI.q); if(!norm(c.name+' '+c.city+' '+c.phone+' '+c.email).includes(q)) return false; }
    return true;
  });
}
function sortList(list){
  const rank=c=>(sc(c).tier==='X'?-1000:0)+sc(c).pct;
  if(UI.sort==='date') return list.sort((a,b)=>b.created_at.localeCompare(a.created_at));
  if(UI.sort==='stars') return list.sort((a,b)=>(b.stars||0)-(a.stars||0)||rank(b)-rank(a));
  return list.sort((a,b)=>rank(b)-rank(a)||b.created_at.localeCompare(a.created_at));
}

/* ---------- barra lateral ---------- */
function renderSide(){
  $('vnav').innerHTML='<button data-v="all" class="'+(UI.vaga==='all'?'sel':'')+'"><span class="dot" style="background:var(--side-muted)"></span><span class="t">Todas as vagas</span><span class="n">'+cands.length+'</span></button>'
    +vagas.map(v=>'<button data-v="'+esc(v.id)+'" class="'+(UI.vaga===v.id?'sel':'')+'"><span class="dot'+(v.active?'':' off')+'"></span><span class="t">'+esc(v.title)+(v.store?' · '+esc(v.store):'')+'</span><span class="n">'+cands.filter(c=>c.vaga_id===v.id).length+'</span></button>').join('');
  $('vagaPick').innerHTML='<option value="all">Todas as vagas</option>'+vagas.map(v=>'<option value="'+esc(v.id)+'"'+(UI.vaga===v.id?' selected':'')+'>'+esc(v.title)+(v.store?' · '+esc(v.store):'')+'</option>').join('');
}

/* ---------- pipeline (quadro) ---------- */
function renderCand(){
  if(UI.vaga!=='all' && !vagas.some(v=>v.id===UI.vaga)) UI.vaga='all';
  renderSide();
  const v=vagas.find(x=>x.id===UI.vaga);
  $('pTitle').textContent=v?v.title:'Todas as vagas';
  $('pShare').classList.toggle('hide',!v);
  const base=cands.filter(c=>UI.vaga==='all'||c.vaga_id===UI.vaga);
  const ok=base.filter(c=>sc(c).tier!=='X');
  const avg=ok.length?Math.round(ok.reduce((s,c)=>s+sc(c).pct,0)/ok.length):0;
  const today=base.filter(c=>Date.now()-new Date(c.created_at)<864e5).length;
  $('pMeta').innerHTML=(v&&v.store?'<span>'+esc(v.store)+(v.kind?' · '+esc(v.kind):'')+'</span>':'')
    +'<span><b>'+base.length+'</b> inscritos</span><span><b>'+base.filter(c=>sc(c).tier==='A').length+'</b> nível A</span>'
    +'<span>score médio <b>'+avg+'</b></span><span><b>'+today+'</b> nas últimas 24h</span>';
  const cnt={A:0,B:0,C:0,X:0}; base.forEach(c=>cnt[sc(c).tier]++);
  $('tierSeg').innerHTML='<button data-t="all" class="'+(UI.tier==='all'?'sel':'')+'">Todos</button>'

function card(c){

  s.highlights.slice(0,2).forEach(h=>chips.push('<span class="chip">'+esc(h.replace(/\?$/,'').slice(0,40))+'</span>'));

    +'<div class="kc-bar"><i style="width:'+(s.tier==='X'?100:s.pct)+'%;background:'+TIERC[s.tier]+'"></i></div>'
    +(chips.length?'<div class="chips">'+chips.join('')+'</div>':'')
    +'<div class="kc-f">'+ic('clock')+ago(c.created_at)+(UI.vaga==='all'&&v.title?' · '+esc(v.title):'')
    +'<span class="r">'+(c.stars?'<span class="stars">'+'★'.repeat(c.stars)+'</span>':'')+(c.cv_path?'<span title="Tem currículo">'+ic('file')+'</span>':'')+(c.notes?'<span title="Tem anotação">'+ic('chat')+'</span>':'')+'</span></div></div>';

function renderOpenMarks(){ document.querySelectorAll('.kc').forEach(k=>k.classList.toggle('sel',k.dataset.id===openId)); }
function highlight(text,kws){
  let h=esc(text);
  kws.forEach(k=>{ if(!k.w) return;
    const re=new RegExp('('+norm(k.w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').split('').map(ch=>/[a-z]/.test(ch)?'['+ch+accentsOf(ch)+']':ch).join('')+')','gi');
    h=h.replace(re,'<mark>$1</mark>'); });
  return h;
}
function accentsOf(ch){ return ({a:'áàâãä',e:'éèêë',i:'íìîï',o:'óòôõö',u:'úùûü',c:'ç'})[ch]||''; }
async function openCv(c){
  const w=window.open('','_blank');
  const {data,error}=await sb.storage.from('cvs').createSignedUrl(c.cv_path,600);
  if(error||!data){ if(w) w.close(); toast('Não foi possível abrir o currículo'); return; }
  if(w) w.location=data.signedUrl; else location.href=data.signedUrl;
}
async function patch(c,fields,quiet){
  Object.assign(c,fields); c.updated_at=new Date().toISOString();
  const {error}=await sb.from('candidaturas').update(Object.assign({},fields,{updated_at:c.updated_at})).eq('id',c.id);
  if(error){ toast('⚠︎ Não salvou: '+error.message); return; }
  renderCand();
  if(!quiet){ if(openId===c.id) openCand(c.id); toast('Salvo ✓'); }
  else if(openId===c.id && fields.status){ const b=document.querySelectorAll('#stSel button'); b.forEach(x=>x.classList.toggle('sel',x.dataset.st===c.status)); }
}
async function delCand(c){
  if(!confirm('Excluir a candidatura de '+c.name+' e o currículo? Não dá pra desfazer.')) return;
  if(c.cv_path){ await sb.storage.from('cvs').remove([c.cv_path]); }
  const {error}=await sb.from('candidaturas').delete().eq('id',c.id);
  if(error){ toast('⚠︎ '+error.message); return; }
  cands=cands.filter(x=>x.id!==c.id); closeSheets(); renderCand(); toast('Candidatura excluída');
}

let draft=null, draftNew=false;
function maxPoints(d){
  let m=0; (d.questions||[]).forEach(q=>{ const o=q.options||[];
    if(q.type==='multi'){ const pos=o.reduce((s,x)=>s+Math.max(0,+x.pts||0),0); m+=(+q.cap>0)?Math.min(+q.cap,pos):pos; }
    else m+=Math.max(0,...o.map(x=>+x.pts||0)); });
  const all=(d.keywords||[]).reduce((s,k)=>s+Math.max(0,+k.pts||0),0); m+=(+d.kw_max>0)?Math.min(+d.kw_max,all):all;
  return m;
}
function openVaga(id){

function syncHeader(){
  const d=draft; d.title=$('eTitle').value; d.store=$('eStore').value; d.kind=$('eKind').value; d.salary=$('eSalary').value;
  d.description=$('eDesc').value; d.perks=$('ePerks').value; d.cv_required=$('eCv').checked; d.kw_max=+$('eKwMax').value||0;
  d.thresholds={a:+$('eThA').value||75,b:+$('eThB').value||50};
  if(draftNew) d.id=slugify($('eSlug').value||'');
}
function bindEditor(){
  const body=$('vBody');
  body.oninput=e=>{
    const t=e.target; const qe=t.closest('[data-qi]'); const ke=t.closest('[data-ki]');
    if(qe){ const q=draft.questions[+qe.dataset.qi]; const oe=t.closest('[data-oj]');
      if(oe){ const o=q.options[+oe.dataset.oj]; const f=t.dataset.of; if(f==='l') o.l=t.value; else if(f==='pts') o.pts=+t.value||0; else if(f==='ko') o.ko=t.checked; }
      else if(t.dataset.f==='label') q.label=t.value; else if(t.dataset.f==='cap') q.cap=+t.value||0; else if(t.dataset.f==='hint') q.hint=t.value; else if(t.dataset.f==='required') q.required=t.checked;
      else if(t.dataset.f==='type'){ q.type=t.value; renderEditor(); return; }
    } else if(ke){ const k=draft.keywords[+ke.dataset.ki]; if(t.dataset.kf==='w') k.w=t.value; else k.pts=+t.value||0; }
    else syncHeader();
    $('maxPts').textContent='Pontuação máxima: '+maxPoints(draft)+' pts = 100';
  };
  body.onchange=body.oninput;
  body.onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    const qe=b.closest('[data-qi]'); const qi=qe?+qe.dataset.qi:-1;
    if(b.dataset.q==='del'){ if(confirm('Remover esta pergunta?')){ syncHeader(); draft.questions.splice(qi,1); renderEditor(); } }
    else if(b.dataset.q==='up' && qi>0){ syncHeader(); const q=draft.questions.splice(qi,1)[0]; draft.questions.splice(qi-1,0,q); renderEditor(); }
    else if(b.dataset.o==='add'){ syncHeader(); draft.questions[qi].options.push({v:rid(),l:'',pts:0}); renderEditor(); }
    else if(b.dataset.o==='del'){ syncHeader(); draft.questions[qi].options.splice(+b.closest('[data-oj]').dataset.oj,1); renderEditor(); }
    else if(b.dataset.k==='del'){ syncHeader(); draft.keywords.splice(+b.closest('[data-ki]').dataset.ki,1); renderEditor(); }
    else if(b.id==='qAdd'){ syncHeader(); draft.questions.push({k:'q'+Date.now().toString(36),label:'',type:'single',required:true,options:[{v:'sim',l:'Sim',pts:2},{v:'nao',l:'Não',pts:0}]}); renderEditor(); }
    else if(b.id==='qTpl'){ if(confirm('Substituir perguntas e palavras-chave pelo modelo de atendente?')){ syncHeader(); Object.assign(draft,templateAtendente()); renderEditor(); } }
    else if(b.id==='kwAdd'){ syncHeader(); draft.keywords=draft.keywords||[]; draft.keywords.push({w:'',pts:1}); renderEditor(); }
    else if(b.id==='vSave') saveVaga();
    else if(b.id==='vDel') delVaga();
  };
}
async function saveVaga(){
  syncHeader(); const d=draft;
  if(!d.title.trim()) return toast('Dê um título para a vaga');
  if(draftNew){ if(!d.id) d.id=slugify(d.title+' '+d.store); if(!d.id) return toast('Defina o link da vaga'); if(vagas.some(v=>v.id===d.id)) return toast('Já existe uma vaga com esse link'); }
  d.questions=(d.questions||[]).filter(q=>q.label.trim()).map(q=>Object.assign(q,{options:(q.options||[]).filter(o=>String(o.l).trim())}));
  const bad=d.questions.find(q=>!q.options.length); if(bad) return toast('A pergunta "'+bad.label+'" precisa de respostas');
  d.questions.forEach(q=>{ const seen=new Set(); q.options.forEach(o=>{ if(!o.v||seen.has(o.v)) o.v=rid(); seen.add(o.v); }); });
  d.keywords=(d.keywords||[]).filter(k=>String(k.w).trim()).map(k=>({w:k.w.trim(),pts:+k.pts||0}));
  const row={id:d.id,title:d.title.trim(),store:d.store.trim(),kind:d.kind,salary:d.salary.trim(),description:d.description.trim(),perks:d.perks.trim(),
    active:d.active!==false,cv_required:!!d.cv_required,questions:d.questions,keywords:d.keywords,kw_max:d.kw_max,thresholds:d.thresholds,updated_at:new Date().toISOString()};
  const {error}=await sb.from('vagas').upsert(row,{onConflict:'id'});
  if(error) return toast('⚠︎ '+error.message);
  const i=vagas.findIndex(v=>v.id===row.id); if(i>=0) vagas[i]=Object.assign(vagas[i],row); else vagas.unshift(row);
  rescore(); closeSheets(); render(); toast(draftNew?'Vaga criada — agora é só divulgar 📣':'Regras salvas — scores recalculados ✓');
  if(draftNew) openShare(row);
}
async function delVaga(){
  const n=cands.filter(c=>c.vaga_id===draft.id);
  if(!confirm('Excluir a vaga "'+draft.title+'"'+(n.length?' e as '+n.length+' candidaturas':'')+'? Para só parar de receber, prefira desligar a chave da vaga.')) return;
  const paths=n.map(c=>c.cv_path).filter(Boolean); if(paths.length) await sb.storage.from('cvs').remove(paths);
  const {error}=await sb.from('vagas').delete().eq('id',draft.id); if(error) return toast('⚠︎ '+error.message);
  vagas=vagas.filter(v=>v.id!==draft.id); cands=cands.filter(c=>c.vaga_id!==draft.id); closeSheets(); render(); toast('Vaga excluída');
}

/* ---------- divulgação: legenda + arte (feed 4:5 e story 9:16) ---------- */
function caption(v){
  const perks=String(v.perks||'').split('\n').map(s=>s.trim()).filter(Boolean);
  return '🥥 ESTAMOS CONTRATANDO!\n\n'+v.title+(v.store?' — '+v.store:'')+'\n'
    +[v.kind,v.salary].filter(Boolean).join(' · ')+'\n\n'
    +(v.description?v.description+'\n\n':'')
    +(perks.length?perks.map(p=>'✅ '+p).join('\n')+'\n\n':'')
    +'📲 Inscreva-se pelo link na bio — leva 2 minutinhos!\n'+formUrl(v.id)+'\n\n'
    +'#vagas #emprego #trabalheconosco #vagasdeemprego #coquin #gelato';
}
let logoImg=null;
function loadLogo(){ return new Promise(r=>{ if(logoImg) return r(logoImg); const i=new Image(); i.onload=()=>{logoImg=i;r(i);}; i.onerror=()=>r(null); i.src='logo-coquin-coral.png'; }); }
function wrapText(ctx,text,maxW){ const words=String(text).split(/\s+/); const lines=[]; let cur='';
  words.forEach(w=>{ const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW && cur){ lines.push(cur); cur=w; } else cur=t; }); if(cur) lines.push(cur); return lines; }

/* ---------- vagas ---------- */
function renderVagas(){
  renderSide();
  $('vagaList').innerHTML=vagas.map(v=>{
    const n=cands.filter(c=>c.vaga_id===v.id); const a=n.filter(c=>sc(c).tier==='A').length;
    const open=n.filter(c=>['novo','triagem','entrevista'].includes(colOf(c))).length;
    return '<div class="vc" data-vid="'+esc(v.id)+'"><div class="vc-h"><div style="flex:1;min-width:0"><h3>'+esc(v.title)+'</h3><p>'+esc([v.store,v.kind,v.salary].filter(Boolean).join(' · '))+'</p></div>'
      +'<label class="sw" title="Recebendo inscrições"><input type="checkbox" data-act="toggle"'+(v.active?' checked':'')+'><i></i></label></div>'
      +'<div class="vc-stats"><div><b>'+n.length+'</b><span>inscritos</span></div><div><b style="color:var(--tA)">'+a+'</b><span>nível A</span></div><div><b>'+open+'</b><span>em andamento</span></div></div>'
      +'<div class="link">'+ic('link')+'<span>'+esc(formUrl(v.id))+'</span><button data-act="copy">Copiar</button></div>'
      +'<div class="vc-a"><button class="btn accent sm" data-act="share">'+ic('mega')+'Divulgar</button><button class="btn ghost sm" data-act="see">'+ic('users')+'Candidatos</button>'
      +'<button class="btn ghost sm" data-act="edit">'+ic('gear')+'Regras</button><a class="btn ghost sm" target="_blank" rel="noopener" href="'+esc(formUrl(v.id))+'">'+ic('eye')+'Formulário</a></div></div>';
  }).join('')+'<button class="vc-new" id="newVaga2">'+ic('plus')+'Nova vaga<span class="note">já vem com o modelo de regras para atendente</span></button>';
  $('newVaga2').onclick=()=>openVaga(null);
}
$('vagaList').addEventListener('click',e=>{
  const card=e.target.closest('[data-vid]'); if(!card) return; const v=vagas.find(x=>x.id===card.dataset.vid);
  const b=e.target.closest('[data-act]'); if(!b||!v) return; const act=b.dataset.act;
  if(act==='copy') copy(formUrl(v.id),'Link copiado');
  if(act==='edit') openVaga(v.id);
  if(act==='share') openShare(v);
  if(act==='see'){ UI.vaga=v.id; UI.tier='all'; saveUI(); setView('cand'); }
});
$('vagaList').addEventListener('change',async e=>{
  if(e.target.dataset.act!=='toggle') return; const v=vagas.find(x=>x.id===e.target.closest('[data-vid]').dataset.vid);
  const active=e.target.checked; const {error}=await sb.from('vagas').update({active,updated_at:new Date().toISOString()}).eq('id',v.id);
  if(error){ e.target.checked=!active; toast('Não salvou: '+error.message); return; }
  v.active=active; renderSide(); toast(active?'Vaga aberta: o link está recebendo inscrições':'Vaga encerrada: o link mostra "vaga encerrada"');
});

/* ---------- arte do Instagram (feed 4:5 e story 9:16) ---------- */
async function drawArt(v,fmt){
  try{ await Promise.all([document.fonts.load('400 120px "Instrument Serif"'),document.fonts.load('600 40px Inter'),document.fonts.load('400 40px Inter')]); }catch(e){}
  const story=fmt==='story', W=1080, H=story?1920:1350, P=96;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const SERIF='"Instrument Serif",Georgia,serif', SANS='Inter,Helvetica,Arial,sans-serif';
  x.fillStyle='#16130F'; x.fillRect(0,0,W,H);
  const gl=x.createRadialGradient(W*.95,H*.05,0,W*.95,H*.05,W*.9); gl.addColorStop(0,'rgba(229,98,61,.28)'); gl.addColorStop(1,'rgba(229,98,61,0)'); x.fillStyle=gl; x.fillRect(0,0,W,H);
  let y=story?190:104;
  const lg=await loadLogo(); if(lg){ const lh=56; x.drawImage(lg,P,y,lg.width/lg.height*lh,lh); }
  x.font='500 26px '+SANS; x.fillStyle='rgba(237,232,225,.55)'; x.textAlign='right'; x.textBaseline='top';
  if('letterSpacing' in x) x.letterSpacing='4px';
  x.fillText((v.kind||'VAGA').toUpperCase(),W-P,y+16); x.textAlign='left';
  y+=story?270:210;
  x.fillStyle='#E5623D'; x.font='600 28px '+SANS; x.fillText('ESTAMOS CONTRATANDO',P,y);
  if('letterSpacing' in x) x.letterSpacing='0px';
  y+=56; x.fillStyle='#F6F1EA'; x.textBaseline='alphabetic';
  const tsz=story?156:138; x.font='400 '+tsz+'px '+SERIF;
  wrapText(x,v.title,W-P*2).slice(0,3).forEach(l=>{ y+=tsz*.92; x.fillText(l,P,y); });
  y+=84; x.font='400 34px '+SANS; x.fillStyle='rgba(237,232,225,.62)';
  const meta=[v.store,v.salary].filter(Boolean).join('  ·  '); if(meta){ x.fillText(meta,P,y); y+=20; }
  y+=story?56:38; x.strokeStyle='rgba(237,232,225,.14)'; x.lineWidth=2; x.beginPath(); x.moveTo(P,y); x.lineTo(W-P,y); x.stroke();
  const perks=String(v.perks||'').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,story?6:4);
  const step=story?78:66; y+=story?24:10; x.font='400 36px '+SANS;
  perks.forEach(p=>{ y+=step; x.fillStyle='#E5623D'; x.beginPath(); x.arc(P+7,y-12,7,0,Math.PI*2); x.fill(); x.fillStyle='#EDE8E1'; x.fillText(wrapText(x,p,W-P*2-44)[0],P+40,y); });
  const by=story?H-470:H-196, bh=108;
  x.fillStyle='#E5623D'; x.beginPath(); x.roundRect(P,by,W-P*2,bh,bh/2); x.fill();
  x.fillStyle='#16130F'; x.font='600 38px '+SANS; x.textAlign='center'; x.textBaseline='middle';
  x.fillText(story?'Toque no link e inscreva-se':'Inscreva-se pelo link na bio  →',W/2,by+bh/2+2);
  x.fillStyle='rgba(237,232,225,.5)'; x.font='400 28px '+SANS; x.fillText('leva 2 minutos  ·  envie seu currículo',W/2,by+bh+52);
  if(story){ x.strokeStyle='rgba(237,232,225,.25)'; x.setLineDash([10,10]); x.beginPath(); x.roundRect(W/2-230,by+bh+110,460,96,22); x.stroke(); x.setLineDash([]); x.fillStyle='rgba(237,232,225,.35)'; x.font='400 24px '+SANS; x.fillText('cole aqui a figurinha de link',W/2,by+bh+158); }
  return c;
}
async function openShare(v){
  const cap=caption(v);
  $('sBody').innerHTML='<div class="blk"><h4>1 · Arte</h4><div class="row2" style="align-items:start"><div><canvas id="artFeed" class="artprev"></canvas><button class="btn ghost full" style="margin-top:10px" data-dl="feed">'+ic('down')+'Feed 4:5</button></div>'
    +'<div><canvas id="artStory" class="artprev"></canvas><button class="btn ghost full" style="margin-top:10px" data-dl="story">'+ic('down')+'Story 9:16</button></div></div>'
    +'<div class="note" style="margin-top:10px">No story, adicione a figurinha <b>Link</b> com o endereço abaixo, no espaço marcado.</div></div>'
    +'<div class="blk"><h4>2 · Legenda</h4><pre class="cap">'+esc(cap)+'</pre><button class="btn ghost" style="margin-top:10px" id="capCopy">Copiar legenda</button></div>'
    +'<div class="blk"><h4>3 · Link de inscrição (bio ou figurinha)</h4><div class="link">'+ic('link')+'<span>'+esc(formUrl(v.id))+'</span><button id="lnkCopy">Copiar</button></div></div>';
  openSheet('shareSheet');
  const arts={feed:await drawArt(v,'feed'),story:await drawArt(v,'story')};
  [['artFeed','feed'],['artStory','story']].forEach(([id,k])=>{ const el=$(id); el.width=arts[k].width; el.height=arts[k].height; el.getContext('2d').drawImage(arts[k],0,0); });
  $('capCopy').onclick=()=>copy(cap,'Legenda copiada');
  $('lnkCopy').onclick=()=>copy(formUrl(v.id),'Link copiado');
  $('sBody').querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{
    arts[b.dataset.dl].toBlob(async blob=>{
      const name='vaga-'+v.id+'-'+b.dataset.dl+'.png'; const file=new File([blob],name,{type:'image/png'});
      if(matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:v.title}); return; }catch(e){ if(e.name==='AbortError') return; } }
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
    },'image/png');
  });
}

/* ---------- navegação / painéis ---------- */
function openSheet(id){ document.querySelectorAll('.sheet').forEach(s=>s.classList.toggle('on',s.id===id)); $('scrim').classList.add('on'); }
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on')); $('scrim').classList.remove('on'); openId=null; renderOpenMarks(); }
$('scrim').onclick=closeSheets;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheets(); });
function setView(v){ view=v; document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('sel',b.dataset.view===v));
  $('viewCand').classList.toggle('hide',v!=='cand'); $('viewVagas').classList.toggle('hide',v!=='vagas'); render(); }
$('nav').onclick=e=>{ const b=e.target.closest('[data-view]'); if(b) setView(b.dataset.view); };
$('vnav').onclick=e=>{ const b=e.target.closest('[data-v]'); if(!b) return; UI.vaga=b.dataset.v; saveUI(); setView('cand'); };
$('vagaPick').onchange=e=>{ UI.vaga=e.target.value; saveUI(); renderCand(); };
$('newVaga').onclick=()=>openVaga(null);
$('pShare').onclick=()=>{ const v=vagas.find(x=>x.id===UI.vaga); if(v) openShare(v); };
$('fSort').onchange=e=>{ UI.sort=e.target.value; saveUI(); renderCand(); };
$('fSearch').oninput=e=>{ UI.q=e.target.value; renderCand(); };
$('tierSeg').onclick=e=>{ const b=e.target.closest('[data-t]'); if(b){ UI.tier=b.dataset.t; renderCand(); } };
function render(){ if(view==='cand') renderCand(); else renderVagas(); }

/* ---------- login ---------- */
function showGate(v){ $('authGate').classList.toggle('on',v); }
$('logout').onclick=async()=>{ if(confirm('Sair da conta?')) await sb.auth.signOut(); };
async function onLoggedIn(sess){
  showGate(false); const em=sess.user.email||''; $('meEm').textContent=em; $('meAv').textContent=(em[0]||'·').toUpperCase();
  try{ await load(); }catch(e){ toast('Falha ao carregar: '+(e.message||e)+' (rodou o SETUP.sql?)'); }
  try{ sb.channel('coquin-vagas-rt')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'candidaturas'},p=>{ if(p.new && !cands.some(c=>c.id===p.new.id)){ cands.unshift(Object.assign(p.new,{_s:null})); render(); toast('Nova candidatura: '+p.new.name); } })
    .on('postgres_changes',{event:'*',schema:'public',table:'vagas'},()=>load().catch(()=>{}))
    .subscribe(); }catch(e){}
}
async function doLogin(){
  const email=$('authEmail').value.trim(), pass=$('authPass').value; $('authErr').textContent='';
  if(!email||!pass){ $('authErr').textContent='Preencha e-mail e senha.'; return; }
  const b=$('authBtn'); b.disabled=true; b.textContent='Entrando…';
  try{ const {data,error}=await sb.auth.signInWithPassword({email,password:pass}); if(error) throw error;
    if(/@ponto\.coquin\.app$/i.test(email)){ await sb.auth.signOut(); throw new Error('ponto'); }
    await onLoggedIn(data.session); }
  catch(e){ $('authErr').textContent=e.message==='ponto'?'Login de funcionário não tem acesso às vagas.':'E-mail ou senha incorretos.'; }
  finally{ b.disabled=false; b.textContent='Entrar'; }
}
$('authBtn').onclick=doLogin;
$('authPass').onkeydown=e=>{ if(e.key==='Enter') doLogin(); };
(async function boot(){
  const {data}=await sb.auth.getSession();
  if(data.session) await onLoggedIn(data.session); else showGate(true);
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT'){ vagas=[]; cands=[]; render(); showGate(true); } });
})();
</script>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#446349">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coquin Checklist">
<title>Coquin · Checklist</title>
<link rel="icon" href="logo-coquin.png">
<link rel="apple-touch-icon" href="logo-coquin.png">
<style>
/* ============================================================
   COQUIN — Checklist operacional (app independente)
   Marca: verde #446349 · rotina de entrada e saída
   ============================================================ */
:root{
  --green:#446349; --green-700:#35503A; --green-900:#26381F;
  --green-tint:#E9EFE9; --green-tint-2:#DDE7DD;
  --gold:#C79A3E; --gold-soft:#F3E9CF;
  --bg:#F5F3EE; --surface:#FFFFFF;
  --ink:#26302A; --ink-soft:#5E6B60; --ink-faint:#95A096;
  --line:#E7E4DC; --danger:#C0483F;
  --shadow:0 1px 2px rgba(38,48,42,.05), 0 8px 24px rgba(38,48,42,.06);
  --shadow-lg:0 8px 40px rgba(38,48,42,.16);
  --r:20px; --r-sm:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(160deg,var(--green) 0%,var(--green-700) 78%,var(--green-900) 100%);
  color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;box-shadow:0 6px 22px rgba(38,48,42,.18);
}
.htop{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:11px}
.brand img{height:26px;width:auto;display:block;filter:brightness(0) invert(1)}
.brand .tag{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.85;border-left:1px solid rgba(255,255,255,.28);padding-left:11px}
.acct{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.20);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:650;color:#fff;cursor:pointer}
.acct .dot{width:7px;height:7px;border-radius:999px;background:#8fe0b4;box-shadow:0 0 0 3px rgba(143,224,180,.25)}
.acct.off .dot{background:#e6c15a;box-shadow:0 0 0 3px rgba(230,193,90,.22)}
.hdate{max-width:520px;margin:14px auto 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hdate .today{font-size:20px;font-weight:800;letter-spacing:-.4px;text-transform:capitalize}
.hdate .sub{font-size:12.5px;opacity:.82;font-weight:600;margin-top:1px}
.month-nav{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.20);border-radius:999px;padding:3px}
.month-nav button{border:0;background:transparent;width:32px;height:30px;border-radius:999px;font-size:17px;color:#fff;cursor:pointer;display:grid;place-items:center;opacity:.9}
.month-nav button:active{background:rgba(255,255,255,.18)}
.month-nav .label{font-size:12px;font-weight:700;color:#fff;min-width:92px;text-align:center;text-transform:capitalize;letter-spacing:.2px}

.section-title{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-faint);margin:24px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
.section-title .st-side{text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink-faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{padding:34px 20px;text-align:center;color:var(--ink-faint)}
.empty .em{font-size:32px;margin-bottom:8px}
.empty p{margin:0;font-size:14px;line-height:1.5}
.foot{margin:26px 4px 8px;text-align:center;color:var(--ink-faint);font-size:12px;line-height:1.5}

/* ---------- status tiles ---------- */
.ck-status{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.ck-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 14px 13px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.ck-tile.done{border-color:var(--green);background:linear-gradient(160deg,#F1F6F0,#E9EFE9)}
.ck-tile .ck-tk{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:var(--ink-soft);letter-spacing:.2px}
.ck-tile.done .ck-tk{color:var(--green-700)}
.ck-tile .ck-ring{margin:10px 0 6px}
.ck-tile .ck-frac{font-size:23px;font-weight:850;letter-spacing:-.5px;color:var(--ink)}
.ck-tile.done .ck-frac{color:var(--green-700)}
.ck-tile .ck-frac small{font-size:12px;font-weight:700;color:var(--ink-faint);letter-spacing:0}
.ck-tile .ck-by{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-top:6px;display:flex;align-items:center;gap:6px;min-height:20px}
.ck-tile .ck-by .av{width:19px;height:19px;font-size:9.5px}
.ck-tile .ck-time{color:var(--ink-faint);font-weight:650}
.ck-tile .ck-pending{color:var(--ink-faint);font-weight:650}
.ring{transform:rotate(-90deg)}
.ring .bg{stroke:var(--green-tint-2)}
.ring .fg{stroke:var(--green);transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1);stroke-linecap:round}

/* ---------- seletor entrada|saída ---------- */
.seg{display:flex;gap:8px;margin-top:16px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:15px;font-weight:750;padding:12px;border-radius:12px;cursor:pointer;font-family:inherit;transition:.15s}
.seg button:active{transform:scale(.98)}
.seg button.sel{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 5px 14px rgba(52,80,58,.24)}

/* ---------- quem está fazendo ---------- */
.whowrap{margin-top:18px}
.whotitle{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;margin:0 2px 8px}
.who{display:flex;gap:8px}
.who button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;transition:.15s;font-family:inherit}
.who button:active{transform:scale(.97)}
.who button.sel{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,#fff)}
.av{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;background:var(--pc);flex:none;box-shadow:0 2px 6px rgba(38,48,42,.16)}
.who button .nm{font-size:13px;font-weight:750;color:var(--ink-soft)}
.who button.sel .nm{color:var(--ink)}

/* ---------- lista de tarefas ---------- */
.ck-card{padding:17px 16px 9px;margin-top:16px}
.ck-head{margin-bottom:6px}
.ck-progtxt{font-size:13px;font-weight:800;color:var(--ink-soft);margin-bottom:8px}
.ck-bar{height:9px;border-radius:999px;background:var(--green-tint-2);overflow:hidden}
.ck-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-700));border-radius:999px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.ck-item{display:flex;align-items:center;gap:14px;padding:15px 2px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.ck-item:last-child{border-bottom:0}
.ck-item:active{opacity:.7}
.ck-box{width:28px;height:28px;border-radius:9px;border:2px solid var(--green-tint-2);flex:none;display:grid;place-items:center;transition:.18s;background:var(--surface)}
.ck-box svg{width:16px;height:16px;stroke:#fff;stroke-width:3.2;opacity:0;transform:scale(.4);transition:.18s}
.ck-item.on .ck-box{background:var(--green);border-color:var(--green)}
.ck-item.on .ck-box svg{opacity:1;transform:scale(1)}
.ck-item .ck-lbl{font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.3;transition:.18s}
.ck-item.on .ck-lbl{color:var(--ink-faint);text-decoration:line-through}
.ck-banner{display:flex;align-items:center;gap:10px;border-radius:var(--r-sm);padding:13px 15px;font-size:13.5px;font-weight:750;margin-bottom:4px}
.ck-banner.ok{background:var(--green-tint);border:1px solid var(--green-tint-2);color:var(--green-700)}
.ck-banner.warn{background:var(--gold-soft);border:1px solid #EAD9A8;color:#8A6D1E}
.ck-banner svg{width:19px;height:19px;flex:none;stroke:currentColor}

/* ---------- histórico ---------- */
.hist{padding:4px 16px}
.ck-hrow{display:flex;align-items:center;gap:10px;padding:14px 2px;border-bottom:1px solid var(--line)}
.ck-hrow:last-child{border-bottom:0}
.ck-hdate{width:64px;flex:none}
.ck-hdate .d{font-size:14px;font-weight:800;color:var(--ink);text-transform:capitalize}
.ck-hdate .m{font-size:11px;font-weight:650;color:var(--ink-faint)}
.ck-htags{display:flex;gap:7px;flex-wrap:wrap;flex:1}
.ck-tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:750;padding:5px 9px 5px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-faint);background:var(--surface)}
.ck-tag.ok{border-color:var(--green-tint-2);background:var(--green-tint);color:var(--green-700)}
.ck-tag.part{border-color:#EAD9A8;background:var(--gold-soft);color:#8A6D1E}
.ck-tag .av{width:18px;height:18px;font-size:9px}
.ck-tag .k{opacity:.7;font-weight:700}

/* ---------- login gate ---------- */
.authgate{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,var(--green) 0%,var(--green-700) 70%,var(--green-900) 100%);display:none;align-items:center;justify-content:center;padding:24px}
.authgate.on{display:flex}
.auth-card{width:100%;max-width:340px;text-align:center;color:#fff}
.auth-card .alogo{height:34px;filter:brightness(0) invert(1);margin-bottom:22px}
.auth-card h1{font-size:24px;margin:0 0 6px;font-weight:800}
.auth-card p{font-size:14px;opacity:.85;margin:0 0 20px;line-height:1.5}
.auth-card input{width:100%;border:0;border-radius:13px;padding:15px 16px;font-size:16px;margin-bottom:10px;background:rgba(255,255,255,.95);color:var(--ink)}
.auth-err{color:#ffd7d0;font-size:13px;font-weight:600;min-height:18px;margin:2px 0 8px}
.btn-primary{width:100%;border:0;background:#fff;color:var(--green-700);font-size:16.5px;font-weight:800;padding:16px;border-radius:13px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.btn-primary:active{opacity:.9}
.auth-local{margin-top:14px;background:transparent;border:0;color:#fff;opacity:.85;font-size:13.5px;font-weight:650;text-decoration:underline;cursor:pointer;font-family:inherit}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--green-900);color:#fff;padding:12px 18px;border-radius:999px;font-size:13.5px;font-weight:650;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;z-index:70;display:flex;align-items:center;gap:8px;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .av{width:22px;height:22px;font-size:10px}
</style>
</head>
<body>

<header>
  <div class="htop">
    <div class="brand">
      <img src="logo-coquin.png" alt="Coquin">
      <span class="tag">Checklist</span>
    </div>
    <button class="acct off" id="acct"><span class="dot"></span><span id="acctLbl">Local</span></button>
  </div>
  <div class="hdate">
    <div>
      <div class="today" id="todayBig">—</div>
      <div class="sub" id="todaySub">rotina de entrada e saída</div>
    </div>
    <div class="month-nav">
      <button id="prevM" aria-label="Mês anterior">‹</button>
      <span class="label" id="monthLabel">—</span>
      <button id="nextM" aria-label="Próximo mês">›</button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- resumo de hoje -->
  <div class="ck-status" id="ckStatus"></div>

  <!-- seletor entrada | saída -->
  <div class="seg" id="ckSeg">
    <button data-kind="entrada">🌅 Entrada</button>
    <button data-kind="saida">🌙 Saída</button>
  </div>

  <!-- responsável -->
  <div class="whowrap">
    <div class="whotitle">Quem está fazendo o checklist?</div>
    <div class="who" id="ckWho"></div>
  </div>

  <!-- tarefas -->
  <div class="card ck-card">
    <div class="ck-head">
      <div class="ck-progtxt" id="ckProgTxt">0 de 0</div>
      <div class="ck-bar"><i id="ckBar" style="width:0%"></i></div>
    </div>
    <div id="ckBanner"></div>
    <div id="ckItems"></div>
  </div>

  <!-- histórico -->
  <div class="section-title">Histórico do mês <span class="st-side" id="ckHistCount"></span></div>
  <div class="card hist" id="ckHist"></div>

  <div class="foot">Cada pessoa escolhe seu nome e assinala as tarefas.<br>Fica registrado quem foi o responsável de cada dia.</div>

</main>

<!-- LOGIN / SINCRONIA -->
<div class="authgate" id="authGate">
  <div class="auth-card">
    <img class="alogo" src="logo-coquin-white.png" alt="Coquin">
    <h1>Checklist Coquin</h1>
    <p>Entre com o login da equipe para sincronizar os checklists entre os celulares.</p>
    <input id="authEmail" type="email" inputmode="email" autocapitalize="none" autocomplete="username" placeholder="e-mail">
    <input id="authPass" type="password" autocomplete="current-password" placeholder="senha">
    <div class="auth-err" id="authErr"></div>
    <button class="btn-primary" id="authBtn">Entrar</button>
    <button class="auth-local" id="authLocal">Usar só neste aparelho</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   Coquin — Checklist operacional (app independente)
   Backend: Supabase (tabela `checklists`). Sem login = local.
   ============================================================ */

/* ---- Supabase: mesmo backend da equipe (troque aqui p/ um projeto próprio) ---- */
const SUPABASE_URL='https://anrfipczginloozmatht.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFucmZpcGN6Z2lubG9vem1hdGh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5ODk3NzEsImV4cCI6MjEwMDU2NTc3MX0.Je1pF13l5Lael0EZkDC6o1Qk2XJWcusmX_ElcvdPx40';
const STORE='coquin_checklist_v1';
const APP_VERSION='v1.0';

/* ---- equipe (troque os nomes/cores aqui) ---- */
const TEAM=[
  {name:'Ionnara', color:'#C86B4A'},
  {name:'Ingrid',  color:'#3E7CB1'},
  {name:'Paulo',   color:'#7A6BA8'}
];
function teamColor(name){ const p=TEAM.find(t=>t.name===name); return p?p.color:'var(--ink-faint)'; }
function initials(name){ return (name||'?').trim().charAt(0).toUpperCase(); }

/* ---- tarefas (troque/edite as listas aqui) ---- */
const CHECKLISTS={
  entrada:{ label:'Entrada', emoji:'🌅', items:[
    {k:'org',      t:'Organizar e limpar o ponto'},
    {k:'temp_gel', t:'Verificar temperatura do gelato'},
    {k:'cocos',    t:'Verificar quantidade e qualidade dos cocos'},
    {k:'descart',  t:'Repor descartáveis'},
    {k:'acomp',    t:'Repor acompanhamentos e caldas'},
    {k:'partir',   t:'Partir cocos para repor água dos clientes'},
  ]},
  saida:{ label:'Saída', emoji:'🌙', items:[
    {k:'lavar',    t:'Lavar garrafas, bowls, colheres e afins'},
    {k:'enxugar',  t:'Enxugar o que foi lavado'},
    {k:'guardar',  t:'Organizar e guardar descartáveis'},
    {k:'est_desc', t:'Verificar estoque de descartáveis'},
    {k:'est_acomp',t:'Verificar estoque de acompanhamentos'},
    {k:'caldas',   t:'Verificar caldas'},
    {k:'limpeza',  t:'Limpeza do local'},
    {k:'temp_frz', t:'Verificar temperatura do freezer'},
    {k:'desperd',  t:'Contar desperdício'},
    {k:'sobra',    t:'Verificar quantidade de sobra de coco'},
    {k:'armazen',  t:'Verificar armazenamento dos cocos e acompanhamentos'},
    {k:'bateria',  t:'Verificar bateria das maquinetas'},
  ]},
};
const CK_KINDS=['entrada','saida'];

/* ---------- helpers ---------- */
function ym(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthName(key){ const [y,m]=key.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtTime(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function avatar(name,cls){ return '<span class="av '+(cls||'')+'" style="--pc:'+teamColor(name)+'">'+initials(name)+'</span>'; }
function $(id){ return document.getElementById(id); }

/* ---------- Store (local) ---------- */
const Store={
  load(){ try{ return JSON.parse(localStorage.getItem(STORE))||null; }catch(e){ return null; } },
  save(d){ localStorage.setItem(STORE, JSON.stringify(d)); }
};
let db=Store.load();
if(!db||db.version!==1){ db={version:1, checklists:[]}; Store.save(db); }
if(!db.checklists) db.checklists=[];

let viewMonth=ym(new Date());
let checkKind=(new Date().getHours()<15)?'entrada':'saida';

/* ---------- Cloud (Supabase) ---------- */
const Cloud={
  client:null, on:false, email:null,
  ready(){ return typeof supabase!=='undefined' && !!SUPABASE_URL && !!SUPABASE_ANON; },
  init(){ if(this.client||!this.ready()) return this.client; this.client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{persistSession:true,autoRefreshToken:true}}); return this.client; },
  async pull(){
    const c=this.client;
    const {data:ck,error}=await c.from('checklists').select('*').order('date',{ascending:false});
    if(error) throw error;
    const rows=(ck||[]).map(r=>({id:'ck'+r.date+'|'+r.kind,date:r.date,kind:r.kind,person:r.person||'',items:(r.items&&typeof r.items==='object'?r.items:{}),doneAt:r.done_at||'',note:r.note||'',synced:true}));
    const keys=new Set(rows.map(r=>r.date+'|'+r.kind));
    const pending=(db.checklists||[]).filter(x=>x&&!keys.has(x.date+'|'+x.kind)&&!x.synced);
    db.checklists=rows.concat(pending);
    pending.forEach(x=>this.push(x));
    Store.save(db);
  },
  async _upsert(tiers){ let error; for(const pl of tiers){ ({error}=await this.client.from('checklists').upsert(pl,{onConflict:'date,kind'})); if(!error) return null; } return error; },
  async push(c){ if(!this.on)return;
    const full={date:c.date,kind:c.kind,person:c.person||'',items:(c.items||{}),done_at:(c.doneAt||null),note:c.note||''};
    const core={date:c.date,kind:c.kind,person:c.person||'',items:(c.items||{}),note:c.note||''};
    try{ const err=await this._upsert([full,core]); if(err) throw err; c.synced=true; Store.save(db); }
    catch(e){ toast('⚠︎ Sem conexão — salvo neste aparelho'); } },
  subscribe(){
    try{ this.client.channel('coquin-checklist-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'checklists'},()=>this.pull().then(render).catch(()=>{}))
      .subscribe(); }catch(e){}
  }
};

/* ---------- lógica do checklist ---------- */
function checklistFor(date,kind){ return db.checklists.find(c=>c.date===date && c.kind===kind); }
function ensureChecklist(date,kind){
  let c=checklistFor(date,kind);
  if(!c){ c={id:'ck'+date+'|'+kind,date,kind,person:'',items:{},doneAt:'',note:'',synced:false}; db.checklists.push(c); }
  return c;
}
function ckDone(c){ if(!c) return 0; return CHECKLISTS[c.kind].items.filter(it=>c.items&&c.items[it.k]).length; }
function ckTotal(kind){ return CHECKLISTS[kind].items.length; }
function ckComplete(c){ return c && ckDone(c)===ckTotal(c.kind); }
function saveChecklist(c){
  const wasDone=!!c.doneAt, isDone=ckComplete(c);
  if(isDone && !wasDone) c.doneAt=new Date().toISOString();
  if(!isDone) c.doneAt='';
  c.synced=false; Store.save(db); Cloud.push(c);
}
function toggleCheckItem(kind,itemKey){
  const c=ensureChecklist(todayISO(),kind);
  c.items[itemKey]=!c.items[itemKey];
  saveChecklist(c); renderChecklist();
}
function setCheckPerson(kind,name){
  const c=ensureChecklist(todayISO(),kind);
  c.person=(c.person===name)?'':name;
  saveChecklist(c); renderChecklist();
  if(c.person) toast(avatar(c.person)+' '+c.person+' · responsável pela '+CHECKLISTS[kind].label.toLowerCase());
}

function ckRing(done,total,size){
  const r=(size-6)/2, cx=size/2, C=2*Math.PI*r, off=C*(1-(total?done/total:0));
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    +'<circle class="bg" cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke-width="5"/>'
    +'<circle class="fg" cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke-width="5" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>';
}

/* ---------- render ---------- */
function render(){
  $('monthLabel').textContent=monthName(viewMonth);
  const now=new Date();
  $('todayBig').textContent=now.toLocaleDateString('pt-BR',{weekday:'long'});
  $('todaySub').textContent=now.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  renderChecklist();
}

function renderChecklist(){
  const today=todayISO();

  /* tiles entrada + saída (hoje) */
  $('ckStatus').innerHTML=CK_KINDS.map(kind=>{
    const c=checklistFor(today,kind), meta=CHECKLISTS[kind], tot=ckTotal(kind), done=ckDone(c), full=ckComplete(c);
    let by;
    if(full && c.person) by='<span class="ck-by">'+avatar(c.person)+'<span>'+c.person+' · <span class="ck-time">'+fmtTime(c.doneAt)+'</span></span></span>';
    else if(c && c.person) by='<span class="ck-by">'+avatar(c.person)+'<span>'+c.person+' fazendo…</span></span>';
    else by='<span class="ck-by ck-pending">'+(done?'em andamento':'não iniciado')+'</span>';
    return '<div class="ck-tile'+(full?' done':'')+'">'
      +'<div class="ck-tk">'+meta.emoji+' '+meta.label.toUpperCase()+'</div>'
      +'<div class="ck-ring">'+ckRing(done,tot,54)+'</div>'
      +'<div class="ck-frac">'+done+'<small>/'+tot+'</small></div>'
      +by+'</div>';
  }).join('');

  /* seletor */
  Array.from(document.querySelectorAll('#ckSeg button')).forEach(b=>b.classList.toggle('sel', b.dataset.kind===checkKind));

  /* quem está fazendo */
  const cur=checklistFor(today,checkKind);
  $('ckWho').innerHTML=TEAM.map(p=>{
    const sel=cur&&cur.person===p.name;
    return '<button data-person="'+p.name+'" class="'+(sel?'sel':'')+'" style="--pc:'+p.color+'">'
      +avatar(p.name)+'<span class="nm">'+p.name+'</span></button>';
  }).join('');

  /* barra + itens */
  const meta=CHECKLISTS[checkKind], tot=ckTotal(checkKind), done=ckDone(cur), pct=tot?Math.round(done/tot*100):0;
  $('ckProgTxt').textContent=done+' de '+tot+' tarefas'+(checkKind==='entrada'?' · abertura':' · fechamento');
  $('ckBar').style.width=pct+'%';
  $('ckItems').innerHTML=meta.items.map(it=>{
    const on=cur&&cur.items&&cur.items[it.k];
    return '<div class="ck-item'+(on?' on':'')+'" data-item="'+it.k+'">'
      +'<span class="ck-box"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>'
      +'<span class="ck-lbl">'+it.t+'</span></div>';
  }).join('');

  /* banner */
  let banner='';
  if(ckComplete(cur)){
    if(cur.person) banner='<div class="ck-banner ok"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>'+meta.label+' concluída por <b>'+cur.person+'</b> às '+fmtTime(cur.doneAt)+'</span></div>';
    else banner='<div class="ck-banner warn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg><span>Tudo marcado! Escolha acima <b>quem foi o responsável</b>.</span></div>';
  } else if(done>0 && (!cur||!cur.person)){
    banner='<div class="ck-banner warn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg><span>Não esqueça de marcar <b>seu nome</b> como responsável.</span></div>';
  }
  $('ckBanner').innerHTML=banner;

  renderCkHist();
}

function renderCkHist(){
  const days=db.checklists.filter(c=>c.date.slice(0,7)===viewMonth);
  const byDate={}; days.forEach(c=>{ (byDate[c.date]=byDate[c.date]||{})[c.kind]=c; });
  const dates=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));
  $('ckHistCount').textContent=dates.length?(dates.length+(dates.length>1?' dias':' dia')):'';
  const el=$('ckHist');
  if(!dates.length){ el.innerHTML='<div class="empty"><div class="em">📋</div><p>Nenhum checklist neste mês.<br>Comece marcando as tarefas de hoje.</p></div>'; return; }
  el.innerHTML=dates.map(d=>{
    const [Y,M,D]=d.split('-').map(Number), dt=new Date(Y,M-1,D);
    const diff=Math.round((new Date(new Date().toDateString())-dt)/86400000);
    const wdShort=dt.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
    const big=diff===0?'Hoje':(diff===1?'Ontem':wdShort.charAt(0).toUpperCase()+wdShort.slice(1));
    const tags=CK_KINDS.map(kind=>{
      const c=byDate[d][kind], meta=CHECKLISTS[kind], tot=ckTotal(kind), done=ckDone(c);
      if(!c||done===0) return '<span class="ck-tag"><span class="k">'+meta.emoji+' '+meta.label+'</span> —</span>';
      const full=done===tot, cls=full?'ok':'part';
      const who=c.person?avatar(c.person):'';
      const txt=full?(c.person||'concluído'):(done+'/'+tot);
      return '<span class="ck-tag '+cls+'"><span class="k">'+meta.emoji+'</span>'+who+' '+txt+'</span>';
    }).join('');
    return '<div class="ck-hrow"><div class="ck-hdate"><div class="d">'+big+'</div><div class="m">'+String(D).padStart(2,'0')+'/'+String(M).padStart(2,'0')+'</div></div><div class="ck-htags">'+tags+'</div></div>';
  }).join('');
}

/* ---------- toast ---------- */
let toastT;
function toast(html){ const t=$('toast'); t.innerHTML=html; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2800); }

/* ---------- eventos ---------- */
$('ckSeg').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b)return; checkKind=b.dataset.kind; renderChecklist(); });
$('ckWho').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b)return; setCheckPerson(checkKind, b.dataset.person); });
$('ckItems').addEventListener('click', e=>{ const it=e.target.closest('.ck-item'); if(!it)return; toggleCheckItem(checkKind, it.dataset.item); });
$('prevM').addEventListener('click', ()=>{ const [y,m]=viewMonth.split('-').map(Number); viewMonth=ym(new Date(y,m-2,1)); render(); });
$('nextM').addEventListener('click', ()=>{ const [y,m]=viewMonth.split('-').map(Number); viewMonth=ym(new Date(y,m,1)); render(); });

/* ---------- conta / login ---------- */
function showGate(v){ $('authGate').classList.toggle('on',v); }
function updateAcct(){
  const a=$('acct');
  if(Cloud.on){ a.classList.remove('off'); $('acctLbl').textContent='Sincronizado'; }
  else { a.classList.add('off'); $('acctLbl').textContent='Local'; }
}
$('acct').addEventListener('click', async()=>{
  if(Cloud.on){ if(confirm('Sair da conta? Os checklists continuam salvos neste aparelho.')){ try{ await Cloud.client.auth.signOut(); }catch(e){} } }
  else { showGate(true); }
});
async function onLoggedIn(sess){
  Cloud.on=true; Cloud.email=sess.user.email; showGate(false);
  try{
    const {data:ck}=await Cloud.client.from('checklists').select('date').limit(1);
    if((!ck||!ck.length) && db.checklists.length){ for(const k of db.checklists){ await Cloud.push(k); } }
    await Cloud.pull();
  }catch(e){ toast('Falha ao sincronizar — usando dados locais'); }
  render(); updateAcct(); Cloud.subscribe();
}
async function doLogin(){
  const email=$('authEmail').value.trim(), pass=$('authPass').value;
  const err=$('authErr'); err.textContent='';
  if(!email||!pass){ err.textContent='Preencha e-mail e senha.'; return; }
  const btn=$('authBtn'); btn.disabled=true; btn.textContent='Entrando…';
  try{
    const {data,error}=await Cloud.client.auth.signInWithPassword({email,password:pass});
    if(error) throw error;
    await onLoggedIn(data.session); toast('Conectado ✓');
  }catch(e){ err.textContent=(e&&e.message&&/invalid|credential/i.test(e.message))?'E-mail ou senha incorretos.':'Não foi possível entrar. Tente de novo.'; }
  finally{ btn.disabled=false; btn.textContent='Entrar'; }
}
$('authBtn').addEventListener('click', doLogin);
$('authPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
$('authLocal').addEventListener('click', ()=>{ showGate(false); Cloud.on=false; updateAcct(); });

/* ---------- boot ---------- */
async function boot(){
  render();
  if(!Cloud.ready()){ updateAcct(); return; }
  Cloud.init();
  let sess=null;
  try{ const {data}=await Cloud.client.auth.getSession(); sess=data.session; }catch(e){}
  if(sess){ await onLoggedIn(sess); }
  else { showGate(true); }
  try{ Cloud.client.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ Cloud.on=false; Cloud.email=null; updateAcct(); showGate(true); } }); }catch(e){}
}
boot();
</script>
